# SPDX-License-Identifier: GPL-3.0-or-later
#
# Spike only: proves a GitHub Actions macOS runner can build an unsigned
# .ipa from spike/ios (a throwaway Compose Multiplatform app) that
# SideStore/AltStore can sideload. Never touches core/, client/ or app/.
name: iOS spike

on:
  push:
    branches: [spike/ios-ipa]
  workflow_dispatch:

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-15
    # Publishing to the ios-test prerelease.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: spike/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Xcode version
        run: xcodebuild -version
      # The Xcode target's "Compile Kotlin Framework" run-script build phase
      # calls ./gradlew :shared:embedAndSignAppleFrameworkForXcode itself,
      # reading CONFIGURATION/SDK_NAME/ARCHS from the environment Xcode sets
      # for that phase -- the same thing the JetBrains KMP wizard generates.
      # A prime here just warms the Gradle/Kotlin toolchain download so that
      # cost doesn't show up inside the (less legible) Xcode build log.
      - name: Prime the Gradle/Kotlin toolchain
        run: ./gradlew :shared:tasks --stacktrace
      - name: Build the unsigned .app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package the .ipa
        run: |
          set -euo pipefail
          app_path="build/Build/Products/Release-iphoneos/iosApp.app"
          test -d "$app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -r -X fulla-ios-test.ipa Payload
          ls -la fulla-ios-test.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fulla-ios-test-ipa
          path: spike/ios/fulla-ios-test.ipa
          if-no-files-found: error
      - name: Publish to the ios-test prerelease
        if: github.ref == 'refs/heads/spike/ios-ipa'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-test --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-test fulla-ios-test.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iOS spike: unsigned test build" \
            --notes "Unsigned .ipa from the spike/ios-ipa branch, spike/ios/. Sideload only (SideStore/AltStore). Not a release."
