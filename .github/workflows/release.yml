# SPDX-License-Identifier: GPL-3.0-or-later
#
# A release: push a tag such as v0.1.0. The job builds the signed APK and
# attaches it, with setup.sql for setting up a Supabase project by hand, to a
# GitHub release of the tag. Installed apps find it there and update
# themselves. The release notes come from docs/releases/<version>.md.
#
# Signing needs four repository secrets (Settings → Secrets → Actions):
#   FULLA_KEYSTORE_B64       the upload keystore, base64-encoded
#   FULLA_KEYSTORE_PASSWORD  its password
#   FULLA_KEY_ALIAS          the key's alias
#   FULLA_KEY_PASSWORD       the key's password
# Run by hand without them (Actions → Release → Run workflow) and it only
# checks that the release build, with R8, compiles.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
            # versionCode from the tag (major*10000 + minor*100 + patch), not
            # the CI run number: run numbers are not permanent — they'd
            # restart from 1 if this repository were ever moved or recreated
            # — but Android refuses to install an "update" whose versionCode
            # is not strictly higher than what's already on the phone.
            # Deriving it from the tag keeps working through that, since tags
            # keep increasing by construction (semver).
            if [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              code=$((${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]}))
            else
              echo "::error::Tag '$GITHUB_REF_NAME' is not major.minor.patch; cannot derive a versionCode."
              exit 1
            fi
          else
            name="0.0.0-check"
            # Not a tagged release: the run number is fine here. Debug builds
            # are signed with a different key (see ci.yml) and Android never
            # offers to install one over a release build, or vice versa, so
            # this number never has to out-rank a real release's.
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "FULLA_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "FULLA_VERSION_CODE=$code" >> "$GITHUB_ENV"
      # Only writes the keystore file (not a secret by itself without the
      # passwords) and says whether it did, through step outputs. The
      # passwords themselves go straight from secrets to the Build step's own
      # env below, never through $GITHUB_ENV — that would put them in every
      # later step's environment, including whatever a Gradle plugin runs.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FULLA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A tagged release needs the signing secrets; see the top of release.yml."
              exit 1
            fi
            echo "No signing key: building unsigned, to check the release build only."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "keystore=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          FULLA_PROJECT_URL: ${{ secrets.FULLA_PROJECT_URL }}
          FULLA_ANON_KEY: ${{ secrets.FULLA_ANON_KEY }}
          FULLA_GOOGLE_CLIENT_ID: ${{ secrets.FULLA_GOOGLE_CLIENT_ID }}
          FULLA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FULLA_KEYSTORE_PASSWORD: ${{ secrets.FULLA_KEYSTORE_PASSWORD }}
          FULLA_KEY_ALIAS: ${{ secrets.FULLA_KEY_ALIAS }}
          FULLA_KEY_PASSWORD: ${{ secrets.FULLA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: setup.sql
        run: npm run db:bundle
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fulla-$FULLA_VERSION_NAME.apk"
          notes="docs/releases/$FULLA_VERSION_NAME.md"
          [ -f "$notes" ] || { echo "Fulla $FULLA_VERSION_NAME." > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          gh release create "$GITHUB_REF_NAME" "fulla-$FULLA_VERSION_NAME.apk" dist/setup.sql \
            --title "Fulla $FULLA_VERSION_NAME" --notes-file "$notes"
