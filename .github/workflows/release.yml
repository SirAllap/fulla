# SPDX-License-Identifier: GPL-3.0-or-later
#
# A release: push a tag such as v0.1.0. The job builds the signed APK and
# attaches it, with setup.sql for setting up a Supabase project by hand, to a
# GitHub release of the tag. Installed apps find it there and update
# themselves. The release notes come from docs/releases/<version>.md.
#
# Signing needs four repository secrets (Settings → Secrets → Actions):
#   FULLA_KEYSTORE_B64       the upload keystore, base64-encoded
#   FULLA_KEYSTORE_PASSWORD  its password
#   FULLA_KEY_ALIAS          the key's alias
#   FULLA_KEY_PASSWORD       the key's password
# Run by hand without them (Actions → Release → Run workflow) and it only
# checks that the release build, with R8, compiles.
#
# Run by hand on main with a version (say 0.1.40) and it publishes that
# release itself: it checks that docs/releases/0.1.40.md exists and that
# there is no such release yet, builds the signed APK, and creates the tag
# v0.1.40 on the commit it built, the release with those notes, and its
# files. Nobody has to make the tag or copy the notes by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version (major.minor.patch, e.g. 0.1.40). Empty: only check that the release build compiles.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Version from the tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$VERSION" ]; then
            # Published by hand: only from main, only with its notes written, only once.
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::A release is published from main only, not from $GITHUB_REF."
              exit 1
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$VERSION' is not major.minor.patch."
              exit 1
            fi
            if [ ! -f "docs/releases/$VERSION.md" ]; then
              echo "::error::docs/releases/$VERSION.md is missing: write the notes first."
              exit 1
            fi
            if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
              echo "::error::v$VERSION already exists."
              exit 1
            fi
            echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          if [ -n "$VERSION" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${VERSION:-${GITHUB_REF#refs/tags/v}}"
            # versionCode from the tag (major*10000 + minor*100 + patch), not
            # the CI run number: run numbers are not permanent — they'd
            # restart from 1 if this repository were ever moved or recreated
            # — but Android refuses to install an "update" whose versionCode
            # is not strictly higher than what's already on the phone.
            # Deriving it from the tag keeps working through that, since tags
            # keep increasing by construction (semver).
            if [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              code=$((${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]}))
            else
              echo "::error::Tag '$GITHUB_REF_NAME' is not major.minor.patch; cannot derive a versionCode."
              exit 1
            fi
          else
            name="0.0.0-check"
            # Not a tagged release: the run number is fine here. Debug builds
            # are signed with a different key (see ci.yml) and Android never
            # offers to install one over a release build, or vice versa, so
            # this number never has to out-rank a real release's.
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "FULLA_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "FULLA_VERSION_CODE=$code" >> "$GITHUB_ENV"
      # Only writes the keystore file (not a secret by itself without the
      # passwords) and says whether it did, through step outputs. The
      # passwords themselves go straight from secrets to the Build step's own
      # env below, never through $GITHUB_ENV — that would put them in every
      # later step's environment, including whatever a Gradle plugin runs.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FULLA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              echo "::error::A tagged release needs the signing secrets; see the top of release.yml."
              exit 1
            fi
            echo "No signing key: building unsigned, to check the release build only."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "keystore=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          FULLA_PROJECT_URL: ${{ secrets.FULLA_PROJECT_URL }}
          FULLA_ANON_KEY: ${{ secrets.FULLA_ANON_KEY }}
          FULLA_GOOGLE_CLIENT_ID: ${{ secrets.FULLA_GOOGLE_CLIENT_ID }}
          FULLA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FULLA_KEYSTORE_PASSWORD: ${{ secrets.FULLA_KEYSTORE_PASSWORD }}
          FULLA_KEY_ALIAS: ${{ secrets.FULLA_KEY_ALIAS }}
          FULLA_KEY_PASSWORD: ${{ secrets.FULLA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: setup.sql
        run: npm run db:bundle
      - name: Publish
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fulla-$FULLA_VERSION_NAME.apk"
          # Same file under a fixed name: the website links to releases/latest/download/fulla.apk.
          cp app/build/outputs/apk/release/app-release.apk fulla.apk
          notes="docs/releases/$FULLA_VERSION_NAME.md"
          [ -f "$notes" ] || { echo "Fulla $FULLA_VERSION_NAME." > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          # A release published by hand (from the phone, say) already exists:
          # its notes stay as written and only the files are attached.
          # Published by hand, the tag does not exist yet: the release makes it, on the very commit that was built.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "fulla-$FULLA_VERSION_NAME.apk" fulla.apk dist/setup.sql --clobber
          else
            gh release create "$RELEASE_TAG" "fulla-$FULLA_VERSION_NAME.apk" fulla.apk dist/setup.sql \
              --target "$GITHUB_SHA" --title "Fulla $FULLA_VERSION_NAME" --notes-file "$notes"
          fi
