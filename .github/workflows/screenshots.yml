#
# Renders every main screen with demo data, light and dark, and pushes the
# pictures to the `screenshots` branch (never to main). Run by hand:
# Actions → Screenshots → Run workflow.
name: Screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Render
        env:
          FULLA_SCREENSHOTS: 'true'
        run: ./gradlew :app:testDebugUnitTest --tests '*Screenshot*'
      - name: Push to the screenshots branch
        run: |
          ls screenshots
          cd screenshots
          git init -q -b screenshots
          git config user.name SirAllap
          git config user.email 53468881+SirAllap@users.noreply.github.com
          git add -A
          git commit -q -m "Screenshots of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
