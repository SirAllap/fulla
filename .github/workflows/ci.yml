# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leakcheck:
    name: Secrets and personal data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The denylist is a repository secret and never part of the repository.
      # Forks and pull requests from forks run with the secret rules only.
      - name: Working tree
        env:
          LEAKCHECK_DENYLIST: ${{ secrets.LEAKCHECK_DENYLIST }}
        run: node tools/leakcheck/leakcheck.mjs
      - name: Every language has every string
        run: node tools/i18n/check.mjs
      - name: Every commit, message and author
        env:
          LEAKCHECK_DENYLIST: ${{ secrets.LEAKCHECK_DENYLIST }}
        run: node tools/leakcheck/leakcheck.mjs --history

  database:
    name: Database
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: PostgreSQL binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
          fi
          ls /usr/lib/postgresql/
      - name: Tests
        run: npm run test:db
      - name: Build setup.sql
        run: npm run db:bundle
      # Built here only to prove it builds. It ships with each release
      # instead of being uploaded as a CI artifact, since artifact storage is
      # limited and shared across everything else in the account.

  core:
    name: Domain logic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Tests and coverage
        run: ./gradlew :core:test :core:koverVerify :client:test :client:koverVerify

  android:
    name: Android app
    runs-on: ubuntu-24.04
    needs: core
    # Uploading the debug APK to the `latest-debug` prerelease.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      # The default package list includes `tools`, which Google has withdrawn;
      # sdkmanager then exits 1. AGP fetches platform and build-tools itself.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # One debug key for every run, kept as a repository secret, so a newer
      # debug APK always installs over an older one and nobody loses their
      # data. A fork pull request never sees that secret, so it gets a
      # throwaway key generated fresh for that run only, used and discarded —
      # never cached or shared between runs.
      - name: Place the debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.FULLA_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.fulla-debug
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.fulla-debug/debug.keystore
          elif [ ! -f ~/.fulla-debug/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.fulla-debug/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "FULLA_DEBUG_KEYSTORE=$HOME/.fulla-debug/debug.keystore" >> "$GITHUB_ENV"
          # Google sign-in needs this fingerprint registered for the debug app
          # (docs/hosting.md). It identifies the key, it is not the key.
          keytool -list -v -keystore ~/.fulla-debug/debug.keystore -storepass android | grep -E 'SHA1:|SHA256:'
      - name: Build
        # The household server and Google sign-in, if configured as secrets.
        # Without them the build asks people for their own Supabase project.
        env:
          FULLA_PROJECT_URL: ${{ secrets.FULLA_PROJECT_URL }}
          FULLA_ANON_KEY: ${{ secrets.FULLA_ANON_KEY }}
          FULLA_GOOGLE_CLIENT_ID: ${{ secrets.FULLA_GOOGLE_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Publish the debug APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" fulla-debug.apk
          gh release delete latest-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-debug fulla-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build" --notes "Debug build of $GITHUB_SHA. Not a release."
